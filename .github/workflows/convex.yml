# Pushes convex/ to the Convex deployment (brilliant-starling-517) when main changes, so
# merged @Claude changes to the backend go live without someone running `bun convex`.
# Needs a CONVEX_DEPLOY_KEY repo secret: a deploy key for that deployment from the Convex
# dashboard (Settings → Deploy keys). Then set CONVEX_AUTODEPLOY = true in convex/lib/improve.ts.
name: Deploy Convex

on:
  push:
    branches: [main]
    paths: ["convex/**", "package.json", "bun.lock"]

concurrency: convex-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CONVEX_AUTODEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx convex dev --once
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
